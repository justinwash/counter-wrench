# Flat-rate service menu. Prices are a ballpark US draft for Justin to adjust.
# "per wheel" / "per brake" / "per cable" items are priced per unit; work order lines carry
# the quantity. Categories: inspection, adjustment, install, service, tune_up.

# --- Inspection and tune-ups ---------------------------------------------------------------

- code: INSPECT
  name: Inspection and diagnosis
  description: Look the bike over, confirm the issue, and explain findings. Waived if work is booked.
  category: inspection
  price_cents: 2500
  est_minutes: 20

- code: SAFETY-CHECK
  name: Safety check
  description: Brakes, wheel retention, headset, bolts to torque, tire condition.
  category: inspection
  price_cents: 3000
  est_minutes: 20

- code: TUNE-BASIC
  name: Basic tune-up
  description: Adjust shifting and brakes, true wheels on the bike, torque check, wipe-down.
  category: tune_up
  price_cents: 9500
  est_minutes: 60

- code: TUNE-STANDARD
  name: Standard tune-up
  description: Basic tune-up plus drivetrain clean, wheel truing off the bike, hub and headset adjustment.
  category: tune_up
  price_cents: 15000
  est_minutes: 90

- code: TUNE-OVERHAUL
  name: Complete overhaul
  description: Full strip, clean, and rebuild of all bearings and drivetrain; new cables and housing.
  category: tune_up
  price_cents: 30000
  est_minutes: 240

# --- Drivetrain ------------------------------------------------------------------------------

- code: DRIVETRAIN-ADJUST
  name: Shifting adjustment
  description: Index derailleurs and set limits.
  category: adjustment
  price_cents: 2500
  est_minutes: 15

- code: HANGER-ALIGN
  name: Derailleur hanger alignment
  description: Check and straighten the derailleur hanger, then re-index.
  category: adjustment
  price_cents: 2000
  est_minutes: 15

- code: DRIVETRAIN-CLEAN
  name: Drivetrain deep clean
  description: Remove and degrease chain, cassette, and chainrings; re-lube.
  category: service
  price_cents: 6000
  est_minutes: 45

- code: CHAIN-INSTALL
  name: Chain install
  description: Size and install a chain.
  category: install
  price_cents: 1500
  est_minutes: 10

- code: CASSETTE-INSTALL
  name: Cassette install
  description: Remove and install a cassette.
  category: install
  price_cents: 1500
  est_minutes: 10

- code: DERAILLEUR-INSTALL
  name: Rear derailleur install
  description: Install and adjust a rear derailleur (cable or wireless).
  category: install
  price_cents: 3500
  est_minutes: 30

- code: SHIFT-CABLE
  name: Shift cable and housing replacement
  description: Replace one shift cable and its housing, then adjust. Per cable.
  category: service
  price_cents: 3000
  est_minutes: 30

- code: BB-INSTALL-THREADED
  name: Threaded bottom bracket install
  description: Remove crank, remove and install a threaded BB (BSA, T47, Italian), reinstall crank.
  category: install
  price_cents: 3500
  est_minutes: 30

- code: BB-INSTALL-PRESSFIT
  name: Press-fit bottom bracket install
  description: Remove crank, extract and press in a press-fit BB (PF92, BB86, PF30, BB30), reinstall crank.
  category: install
  price_cents: 5000
  est_minutes: 45

