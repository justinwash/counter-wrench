# Bike catalog. Every entry names one model year and links the spec page it came from.
# Values not stated by the source were inferred from component models and verified by Justin.
#
# Known v0 simplification (DECISIONS D-017): wheel sizes are for medium-and-up frames.
# Small frames on several of these bikes use smaller wheels; that's deliberately deferred.
#
# Max tire widths are converted from inches and rounded: 2.4" = 61, 2.5" = 64, 2.6" = 66 mm.

