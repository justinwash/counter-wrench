[project]
name = "counterwrench"
version = "0.1.0"
description = "Front-of-house service intake and triage agent for bike shops"
readme = "README.md"
license = "MIT"
authors = [{ name = "Justin Wash" }]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
