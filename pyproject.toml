[project]
name = "counterwrench"
version = "0.1.0"
description = "Front-of-house service intake and triage agent for bike shops"
readme = "README.md"
license = "MIT"
authors = [{ name = "Justin Wash" }]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
    "langchain-openrouter>=0.2.9",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
