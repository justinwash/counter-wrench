# --- edge (16): ambiguity, catalog gaps, multi-row, known limitations --------------------------

- id: e01-ambiguous-fuelex-year
  slice: edge
  tags: [bike-ambiguity]
  intake: {bike_freetext: "Trek Fuel EX 8, not sure what year", rows: [{row_id: r1, complaint: skipping, suspected_area: cassette, note: "Skips on climbs, needs a new cassette I think."}]}
  suggestion: {r1: {labor_required: [CASSETTE-INSTALL], labor_acceptable: [CHAIN-INSTALL, INSPECT], part_categories: [cassette]}}
  judge_notes: The 2012 and 2023 Fuel EX 8 take different cassettes (10-speed HG vs 12-speed Micro Spline); the year must be pinned down before parts.

