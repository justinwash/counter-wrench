  slice: edge
  tags: [d-020, rim-width]
  intake: {bike_id: trek-fuel-ex-8-gen-6-2023, rows: [{row_id: r1, complaint: other, suspected_area: tire, note: "Wants to put 700x25 road slicks on it for the bike path."}]}
