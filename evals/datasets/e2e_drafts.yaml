  suggestion: {r1: {labor_required: [TIRE-INSTALL], part_categories: [tire], forbidden_parts: [maxxis-ardent-29x2-4, maxxis-dhr2-29x2-4, maxxis-dhf-29x2-5, maxxis-rekon-29x2-6]}}
  judge_notes: XS/S Marlin 7 Gen 3 frames use 27.5" wheels; the catalog only models the 29" (D-017), so a 29" tire is wrong here.

- id: e04-fuelex-700c-tube-29er
  slice: edge
  tags: [wheel-naming]
